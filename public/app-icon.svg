<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Screencup: a steaming espresso cup whose body is a screen, standing on a saucer that
       doubles as the monitor stand. Source for `npx tauri icon app-icon.svg`. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4b33"/>
      <stop offset="1" stop-color="#4a2b1c"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a6b"/>
      <stop offset="1" stop-color="#d42a3a"/>
    </linearGradient>
    <linearGradient id="steam" gradientUnits="userSpaceOnUse" x1="0" y1="168" x2="0" y2="28">
      <stop offset="0" stop-color="#cfd8e3"/>
      <stop offset="1" stop-color="#cfd8e3" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- steam -->
  <g fill="none" stroke="url(#steam)" stroke-width="20" stroke-linecap="round">
    <path d="M168 158 C 140 124, 196 104, 168 64"/>
    <path d="M236 150 C 208 112, 264 92, 236 40"/>
    <path d="M304 158 C 276 124, 332 104, 304 64"/>
  </g>

  <!-- saucer / stand -->
  <rect x="214" y="398" width="68" height="28" fill="#3a2116"/>
  <rect x="44" y="418" width="408" height="36" rx="18" fill="#3a2116"/>
  <rect x="84" y="418" width="328" height="8" rx="4" fill="#ffffff" opacity="0.12"/>

  <!-- handle -->
  <path d="M396 214 h22 a60 60 0 0 1 0 120 h-22" fill="none" stroke="#4a2b1c" stroke-width="34"
        stroke-linecap="round"/>

  <!-- cup body = screen bezel: flat rim on top, rounded like a cup at the bottom -->
  <path d="M84 178 h300 a20 20 0 0 1 20 20 v118 a90 90 0 0 1 -90 90 h-160 a90 90 0 0 1 -90 -90 v-118 a20 20 0 0 1 20 -20 z"
        fill="url(#body)"/>
  <!-- rim highlight -->
  <rect x="80" y="182" width="308" height="10" rx="5" fill="#ffffff" opacity="0.18"/>

  <!-- display -->
  <rect x="96" y="206" width="276" height="150" rx="16" fill="url(#screen)"/>
  <path d="M96 222 a16 16 0 0 1 16 -16 h150 l-120 150 h-30 a16 16 0 0 1 -16 -16 z" fill="#ffffff"
        opacity="0.12"/>

  <!-- capture corners on the display -->
  <g fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M136 252 v-20 h22"/>
    <path d="M310 232 h22 v20"/>
    <path d="M332 310 v20 h-22"/>
    <path d="M158 330 h-22 v-20"/>
  </g>
</svg>
