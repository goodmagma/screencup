<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Tray variant of app-icon.svg: no saucer or dark bezel, bold shapes and a white outline so it
       stays readable at 16 px on both dark and light taskbars. -->
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a5c"/>
      <stop offset="1" stop-color="#e02d3c"/>
    </linearGradient>
  </defs>

  <!-- steam -->
  <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round">
    <path d="M19 17 C 15 13, 23 9, 19 4"/>
    <path d="M33 17 C 29 13, 37 9, 33 4"/>
  </g>

  <!-- handle -->
  <path d="M49 30 h3 a8 8 0 0 1 0 16 h-3" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

  <!-- cup body = screen, white outline for contrast -->
  <path d="M6 22 h44 v20 a16 16 0 0 1 -16 16 h-12 a16 16 0 0 1 -16 -16 z" fill="url(#screen)"
        stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>

  <!-- capture corners -->
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 34 v-5 h6"/>
    <path d="M36 29 h6 v5"/>
    <path d="M42 43 v5 h-6"/>
    <path d="M20 48 h-6 v-5"/>
  </g>
</svg>
