[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/goodmagma/screencup"

[profile.release]
lto = "thin"

# The overlay paints full-screen frames in software; keep it fast in dev builds too.
[profile.dev.package.screencup-overlay]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
