[package]
name = "screencup-overlay"
description = "Frozen-screen region selector: captures all monitors, then lets the user pick a region."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde_json = "1.0.154"
softbuffer = "0.4"
winit = "0.30"
# Pinned: 0.9.9 does not compile on Linux (its Wayland recorder uses an older ashpd API).
xcap = "=0.9.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }
