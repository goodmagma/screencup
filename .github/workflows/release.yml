# Builds Screencup for Windows, Linux and macOS.
# - A version tag (`git tag -a v0.1.1 -F docs/release-notes/v0.1.1.md && git push origin v0.1.1`) builds all three and publishes
#   them as a GitHub Release, with the signed updater files and latest.json.
# - From the Actions tab ("Run workflow") it builds by hand: with a tag it releases that tag,
#   without one it only keeps the bundles as workflow artifacts, to test a build.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v0.1.1); empty builds only"
        required: false

permissions:
  contents: write

env:
  # Bundled with the app for screen recording (GPL builds, see THIRD-PARTY-NOTICES.md).
  FFMPEG_WINDOWS_VERSION: "9.0.1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          # 24.04: the PipeWire bindings of the screen capture need PipeWire newer than 22.04's.
          - os: ubuntu-24.04
            bundles: deb,appimage
          - os: macos-latest
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    env:
      # Empty unless a tag is being released: tauri-action then only builds.
      TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libssl-dev libasound2-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxrandr-dev \
            libdbus-1-dev libpipewire-0.3-dev libwayland-dev libgbm-dev libegl1-mesa-dev libclang-dev \
            libxdo-dev

      - name: Download ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "ffmpeg-$env:FFMPEG_WINDOWS_VERSION-essentials_build"
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest "https://github.com/GyanD/codexffmpeg/releases/download/$env:FFMPEG_WINDOWS_VERSION/$name.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
          # prepare-sidecars.mjs also picks up LICENSE and README.txt from the folder above bin/.
          "SCREENCUP_FFMPEG=$env:RUNNER_TEMP\ffmpeg\$name\bin\ffmpeg.exe" >> $env:GITHUB_ENV

      # Static builds by Martin Riedl (ffmpeg.martin-riedl.de), GPL with libx264.
      - name: Download ffmpeg (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          case "$RUNNER_OS" in
            Linux) platform=linux/amd64 ;;
            macOS) platform=macos/arm64 ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/ffmpeg.zip" "https://ffmpeg.martin-riedl.de/redirect/latest/$platform/release/ffmpeg.zip"
          unzip -o "$RUNNER_TEMP/ffmpeg.zip" -d "$RUNNER_TEMP/ffmpeg"
          chmod +x "$RUNNER_TEMP/ffmpeg/ffmpeg"
          echo "SCREENCUP_FFMPEG=$RUNNER_TEMP/ffmpeg/ffmpeg" >> "$GITHUB_ENV"

      - run: npm ci

      # Release text: docs/release-notes/<tag>.md (what changed), then the install notes.
      - name: Release notes
        if: env.TAG != ''
        shell: bash
        run: |
          notes="docs/release-notes/$TAG.md"
          {
            echo "RELEASE_BODY<<__NOTES__"
            if [ -f "$notes" ]; then cat "$notes"; echo; else echo "::warning::$notes not found" >&2; fi
            cat <<'EOF'
          ## Install

          **Windows**: download `Screencup_*_x64-setup.exe` and run it. No administrator rights needed. SmartScreen may warn that the app is not recognised, because the installer is not signed yet: choose "More info", then "Run anyway".

          **Linux**: the `.AppImage` runs on most distributions (`chmod +x`, then start it); the `.deb` is for Debian and Ubuntu.

          **macOS** (Apple silicon): open the `.dmg` and drag Screencup to Applications. The app is not notarised yet: the first time, right-click it and choose Open. Screen recording needs the permission in System Settings, Privacy & Security.
          EOF
            echo "__NOTES__"
          } >> "$GITHUB_ENV"

      # beforeBuildCommand builds the overlay, copies ffmpeg and collects the licences.
      # The updater files are signed with the key pair made by `tauri signer generate`: the
      # public key is in tauri.conf.json, the private one is a repository secret.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ env.TAG }}
          releaseName: Screencup ${{ env.TAG }}
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          # Not a pre-release: the updater follows releases/latest, which skips pre-releases.
          prerelease: false
          uploadUpdaterJson: true
          # Builds without a release keep their bundles as workflow artifacts.
          uploadWorkflowArtifacts: ${{ env.TAG == '' }}
